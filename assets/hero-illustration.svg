<svg viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg">

  <!-- soft background blob -->
  <ellipse cx="280" cy="230" rx="270" ry="220" fill="#f0fdfa"/>

  <!-- ===== LEFT: messy manual tasks ===== -->
  <g>
    <!-- scattered papers -->
    <g transform="translate(90,110) rotate(-12)">
      <rect x="0" y="0" width="64" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="12" y="16" width="40" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="12" y="30" width="40" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="12" y="44" width="24" height="6" rx="3" fill="#cbd5e1"/>
    </g>
    <g transform="translate(50,190) rotate(8)">
      <rect x="0" y="0" width="64" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="12" y="16" width="40" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="12" y="30" width="40" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="12" y="44" width="24" height="6" rx="3" fill="#cbd5e1"/>
    </g>
    <g transform="translate(120,250) rotate(-6)">
      <rect x="0" y="0" width="64" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="12" y="16" width="40" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="12" y="30" width="40" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="12" y="44" width="24" height="6" rx="3" fill="#cbd5e1"/>
    </g>

    <!-- tangled connector lines -->
    <path d="M110 150 Q60 200 95 230 T140 300" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8"/>
    <path d="M70 230 Q140 210 130 270" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8"/>

    <!-- small clock icon: wasted time -->
    <g transform="translate(150,95)">
      <circle cx="18" cy="18" r="18" fill="#e2e8f0"/>
      <path d="M18 8v10l7 6" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===== MIDDLE: transform arrow ===== -->
  <g transform="translate(238,215)">
    <path d="M0 15h60M45 0l18 15-18 15" fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== RIGHT: clean automated flow ===== -->
  <g>
    <!-- node 1 -->
    <rect x="350" y="90" width="120" height="52" rx="12" fill="#0f172a"/>
    <rect x="368" y="108" width="60" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="368" y="122" width="40" height="7" rx="3.5" fill="#5eead4"/>

    <!-- connector -->
    <path d="M410 142v26" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    <path d="M401 160l9 10 9-10" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- node 2 -->
    <rect x="350" y="180" width="120" height="52" rx="12" fill="#0d9488"/>
    <rect x="368" y="198" width="70" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="368" y="212" width="46" height="7" rx="3.5" fill="#ccfbf1"/>

    <!-- connector -->
    <path d="M410 232v26" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    <path d="M401 250l9 10 9-10" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- node 3 -->
    <rect x="350" y="270" width="120" height="52" rx="12" fill="#0f172a"/>
    <rect x="368" y="288" width="55" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="368" y="302" width="35" height="7" rx="3.5" fill="#5eead4"/>

    <!-- connector to success -->
    <path d="M410 322v20" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>

    <!-- success checkmark -->
    <circle cx="410" cy="372" r="26" fill="#0d9488"/>
    <path d="M398 372l9 9 16-18" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
